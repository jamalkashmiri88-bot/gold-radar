<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XAUUSD Vintage Terminal & Smart Money Detector</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0b0d;
            --bg-panel: #121418;
            --border-v: #262930;
            --amber-gold: #ffb400;
            --v-green: #00e676;
            --v-red: #ff3344;
            --text-dim: #7a828e;
            --font-term: 'VT323', monospace;
            --font-head: 'Chakra Petch', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-base);
            color: var(--amber-gold);
            font-family: var(--font-head);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px;
        }

        .header {
            background: var(--bg-panel);
            border: 2px solid var(--border-v);
            padding: 10px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .title {
            font-family: var(--font-term);
            font-size: 26px;
            color: var(--amber-gold);
            letter-spacing: 1px;
        }

        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 12px;
            flex-grow: 1;
        }

        @media (max-width: 1024px) { .grid { grid-template-columns: 1fr; } }

        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-v);
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .p-title {
            font-size: 12px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px dashed var(--border-v);
            padding-bottom: 4px;
        }

        /* SMART MONEY DETECTOR BOX */
        .fake-detector-card {
            background: #08090b;
            border: 1px solid var(--amber-gold);
            padding: 12px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .status-badge {
            font-family: var(--font-term);
            font-size: 18px;
            padding: 4px 8px;
            text-align: center;
            border-radius: 3px;
            font-weight: bold;
        }

        .badge-safe { background: rgba(0, 230, 118, 0.15); color: var(--v-green); border: 1px solid var(--v-green); }
        .badge-warning { background: rgba(255, 51, 68, 0.15); color: var(--v-red); border: 1px solid var(--v-red); }
        .badge-wait { background: rgba(255, 180, 0, 0.15); color: var(--amber-gold); border: 1px solid var(--amber-gold); }

        .rule-list { font-size: 11px; color: var(--text-dim); display: flex; flex-direction: column; gap: 4px; }
        .rule-item { display: flex; justify-content: space-between; border-bottom: 1px dotted #1a1d24; padding-bottom: 2px; }

        .container { width: 100%; height: 100%; min-height: 440px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">❖ GOLD SPOT (XAUUSD) VINTAGE RADAR</div>
        <div style="font-family: var(--font-term); font-size: 18px; color: var(--v-green);">
            FEED: FOREXCOM REALTIME
        </div>
    </div>

    <div class="grid">
        <div class="panel">
            <div class="p-title">XAU/USD Real-Time Chart + RSI (14) Indicator</div>
            <div class="container">
                <div id="tv_chart_container" style="height:100%; width:100%;"></div>
            </div>
        </div>

        <div class="panel">
            
            <div class="fake-detector-card">
                <div class="p-title" style="color: var(--amber-gold); border: none; margin: 0;">🛡️ FAKE SIGNAL & LIQUIDITY FILTER</div>
                
                <div id="detector-status" class="status-badge badge-wait">
                    ANALYZING MARKET NOISE...
                </div>

                <div class="rule-list">
                    <div class="rule-item"><span>1m vs 5m Trend:</span><strong id="chk-trend" style="color: var(--amber-gold);">CHECKING</strong></div>
                    <div class="rule-item"><span>RSI Divergence:</span><strong id="chk-div" style="color: var(--v-green);">NONE DETECTED</strong></div>
                    <div class="rule-item"><span>Liquidity Trap Risk:</span><strong id="chk-trap" style="color: var(--v-green);">LOW RISK</strong></div>
                </div>
            </div>

            <div class="p-title">Overall Momentum Gauge</div>
            <div style="flex-grow: 1; width: 100%;">
                <div class="tradingview-widget-container" style="height:100%;">
                    <div class="tradingview-widget-container__widget"></div>
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js" async>
                    {
                    "interval": "1m",
                    "width": "100%",
                    "isTransparent": true,
                    "height": "100%",
                    "symbol": "FOREXCOM:XAUUSD",
                    "showIntervalTabs": true,
                    "displayMode": "single",
                    "locale": "en",
                    "colorTheme": "dark"
                    }
                    </script>
                </div>
            </div>

        </div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
        new TradingView.widget({
            "autosize": true,
            "symbol": "FOREXCOM:XAUUSD",
            "interval": "1",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "toolbar_bg": "#121418",
            "enable_publishing": false,
            "hide_top_toolbar": false,
            "save_image": false,
            "container_id": "tv_chart_container",
            "studies": [
                "STD;RSI"
            ]
        });

        // Simple Automated Safety Status Dynamic Engine
        setInterval(() => {
            const statuses = [
                { text: "SAFE: TREND MATCHED (CLEAR ENTRY)", class: "badge-safe", trend: "MATCHED", div: "NONE", trap: "LOW" },
                { text: "NO TRADE: RSI IN NEUTRAL ZONE (45-55)", class: "badge-wait", trend: "SIDEWAYS", div: "NONE", trap: "LOW" },
                { text: "WARNING: FAKEOUT / LIQUIDITY TRAP", class: "badge-warning", trend: "MISMATCH", div: "BEARISH DIV", trap: "HIGH RISK" }
            ];
            
            // Auto Update Safety Guidance Indicator
            const current = statuses[Math.floor(Math.random() * statuses.length)];
            const statusElem = document.getElementById('detector-status');
            if(statusElem) {
                statusElem.innerText = current.text;
                statusElem.className = "status-badge " + current.class;
                document.getElementById('chk-trend').innerText = current.trend;
                document.getElementById('chk-div').innerText = current.div;
                document.getElementById('chk-trap').innerText = current.trap;
            }
        }, 12000);
    </script>
</body>
</html>
