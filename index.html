<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XAUUSD / Gold Spot Institutional Radar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #080a0f;
            --bg-card: #11141d;
            --border: #1e2433;
            --text-main: #f0f3fa;
            --text-muted: #788296;
            --green: #00e676;
            --red: #ff3d57;
            --gold: #f5b000;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .navbar {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-icon {
            width: 12px; height: 12px;
            background-color: var(--gold);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--gold);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(245, 176, 0, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(245, 176, 0, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(245, 176, 0, 0); }
        }

        .brand-title { font-size: 15px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
        .brand-badge { background: rgba(245, 176, 0, 0.1); color: var(--gold); border: 1px solid rgba(245, 176, 0, 0.3); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; }

        .dashboard-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
            flex-grow: 1;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        @media (max-width: 1024px) { .dashboard-container { grid-template-columns: 1fr; } }

        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            min-height: 500px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .panel-header h2 { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; }

        .tradingview-widget-container {
            width: 100%;
            height: 100%;
            min-height: 420px;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="brand">
            <div class="brand-icon"></div>
            <span class="brand-title">GOLD SPOT (XAUUSD) RADAR</span>
            <span class="brand-badge">SPOT FOREX & RSI</span>
        </div>
    </div>

    <div class="dashboard-container">
        <!-- GOLD SPOT XAUUSD LIVE CHART WITH RSI -->
        <div class="panel">
            <div class="panel-header">
                <h2>XAUUSD Real-Time Chart & Technical RSI</h2>
                <span style="font-size: 11px; color: var(--gold);">TV SPOT FEED</span>
            </div>
            <div class="tradingview-widget-container">
                <div id="tv_chart_container" style="height: 100%; width: 100%;"></div>
            </div>
        </div>

        <!-- TECHNICAL ANALYSIS & MOMENTUM SUMMARY -->
        <div class="panel">
            <div class="panel-header">
                <h2>XAUUSD Technical Gauge & Liquidity Oscillators</h2>
                <span style="font-size: 11px; color: var(--text-muted);">MULTIPLE TIMEFRAMES</span>
            </div>
            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js" async>
                {
                "interval": "1m",
                "width": "100%",
                "isTransparent": true,
                "height": "100%",
                "symbol": "OANDA:XAUUSD",
                "showIntervalTabs": true,
                "displayMode": "single",
                "locale": "en",
                "colorTheme": "dark"
                }
                </script>
            </div>
        </div>
    </div>

    <!-- TRADINGVIEW ADVANCED CHART SCRIPT -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
        new TradingView.widget({
            "autosize": true,
            "symbol": "OANDA:XAUUSD",
            "interval": "1",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "toolbar_bg": "#080a0f",
            "enable_publishing": false,
            "hide_top_toolbar": false,
            "save_image": false,
            "container_id": "tv_chart_container",
            "studies": [
                "STD;RSI"
            ]
        });
    </script>
</body>
</html>
