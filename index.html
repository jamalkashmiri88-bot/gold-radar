<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XAUUSD Vintage Institutional Radar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0c0d0e;
            --bg-panel: #141619;
            --border-vintage: #2a2e33;
            --amber-gold: #ffb400;
            --amber-glow: rgba(255, 180, 0, 0.2);
            --vintage-green: #00e676;
            --vintage-red: #ff3344;
            --text-dim: #8c96a0;
            --font-terminal: 'VT323', monospace;
            --font-head: 'Chakra Petch', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-base);
            color: var(--amber-gold);
            font-family: var(--font-head);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 12px;
        }

        .vintage-header {
            background: var(--bg-panel);
            border: 2px solid var(--border-vintage);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        .brand-title {
            font-family: var(--font-terminal);
            font-size: 28px;
            letter-spacing: 2px;
            color: var(--amber-gold);
            text-shadow: 0 0 8px var(--amber-glow);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 12px;
            flex-grow: 1;
        }

        @media (max-width: 1024px) { .dashboard-grid { grid-template-columns: 1fr; } }

        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-vintage);
            padding: 12px;
            display: flex;
            flex-direction: column;
        }

        .panel-title {
            font-size: 13px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px dashed var(--border-vintage);
        }

        .chart-container {
            width: 100%;
            height: 100%;
            min-height: 480px;
        }
    </style>
</head>
<body>

    <div class="vintage-header">
        <div class="brand-title">❖ XAUUSD / COMEX GOLD VINTAGE RADAR</div>
        <div style="font-family: var(--font-terminal); font-size: 20px; color: var(--vintage-green);">
            FEED: COMEX REALTIME
        </div>
    </div>

    <div class="dashboard-grid">
        <!-- VINTAGE CHART WITH COMEX FUTURES DATA & RSI -->
        <div class="panel">
            <div class="panel-title">COMEX Gold Futures (GC1!) Chart & RSI Oscillator</div>
            <div class="chart-container">
                <div id="tv_chart_container" style="height:100%; width:100%;"></div>
            </div>
        </div>

        <!-- MULTI-TIMEFRAME ACCURACY SCANNER -->
        <div class="panel">
            <div class="panel-title">Institutional Technical Gauge & Confluence</div>
            <div style="height: 100%; width: 100%;">
                <div class="tradingview-widget-container" style="height:100%;">
                    <div class="tradingview-widget-container__widget"></div>
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js" async>
                    {
                    "interval": "5m",
                    "width": "100%",
                    "isTransparent": true,
                    "height": "100%",
                    "symbol": "COMEX:GC1!",
                    "showIntervalTabs": true,
                    "displayMode": "single",
                    "locale": "en",
                    "colorTheme": "dark"
                    }
                    </script>
                </div>
            </div>
        </div>
    </div>

    <!-- TRADINGVIEW EMBED -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
        new TradingView.widget({
            "autosize": true,
            "symbol": "COMEX:GC1!",
            "interval": "5",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "toolbar_bg": "#141619",
            "enable_publishing": false,
            "hide_top_toolbar": false,
            "save_image": false,
            "container_id": "tv_chart_container",
            "studies": [
                "STD;RSI",
                "STD;Money_Flow_Index"
            ]
        });
    </script>
</body>
</html>
